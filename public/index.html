<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RepoIntel Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header>
    <h1>RepoIntel</h1>
    <button id="openModalBtn">+ Onboard Repository</button>
  </header>

  <main>
    <section id="repoListSection">
      <h2>Onboarded Repositories</h2>
      <ul id="repoList"></ul>
    </section>

    <section id="reportSection" class="hidden">
      <button id="backBtn">&larr; Back</button>
      <div id="docsPrBanner" class="docs-pr-banner hidden"></div>
      <div id="reportContent"></div>

      <div id="chatSection">
        <h3>Ask About This Repository</h3>
        <div id="chatMessages"></div>
        <div id="chatInputArea">
          <input
            type="text"
            id="chatInput"
            placeholder="e.g., How does authentication work? What are the test coverage gaps?"
          />
          <button id="chatSendBtn">Send</button>
        </div>
        <div id="chatSources"></div>
      </div>
    </section>
  </main>

  <div id="onboardModal" class="modal hidden">
    <div class="modal-content">
      <h2>Onboard a Public GitHub Repo</h2>
      <input type="text" id="repoUrlInput" placeholder="https://github.com/user/repo" />
      <div class="modal-actions">
        <button id="submitOnboardBtn">Onboard</button>
        <button id="cancelOnboardBtn">Cancel</button>
      </div>

      <div id="progressArea" class="hidden">
        <p id="progressStatus">Starting...</p>
        <div class="progress-bar-outer">
          <div id="progressBarInner" class="progress-bar-inner"></div>
        </div>
        <p id="progressError" class="error hidden"></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
